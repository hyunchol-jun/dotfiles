# Installed to /etc/keyd/default.conf by scripts/keyd.sh.
# Mirrors the Karabiner rules in config/karabiner/karabiner.json.

[ids]
*

[main]
# Caps Lock: Escape when tapped alone, Control when held with another key
capslock = overload(control, esc)
# Left Control takes over as Caps Lock
leftcontrol = capslock
