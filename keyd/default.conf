# Installed to /etc/keyd/default.conf by scripts/keyd.sh.
# Mirrors the Karabiner rules in config/karabiner/karabiner.json.

[ids]
*

[main]
# Caps Lock: Escape when tapped alone, Control when held with another key.
# Left Control stays Control, so there is no Caps Lock key at all (the Mac's
# Karabiner config moves Caps Lock there; not wanted here).
capslock = overload(control, esc)

# O-Launcher, as in the Mac's Karabiner rule of that name: hold o and tap a
# letter to bring that app forward (t terminal, c Chrome, s Slack).
#
# o stays a letter while typing. It only becomes the launcher key when
#   * it is pressed more than 150ms after the previous letter (so never in the
#     middle of a word), and
#   * another key is pressed AND released while o is still down, or o is held
#     alone for 500ms.
# Rolling from o into the next letter (o down, t down, o up, t up) types "ot".
#
# keyd runs as root outside the desktop session, so it does not start apps
# itself: each letter sends Ctrl+Alt+Super+Shift+<letter>, which Hyprland binds
# in config/hypr/personal.lua. Add an app in both places.
o = lettermod(launcher, o, 150, 500)

[launcher]
t = C-A-M-S-t
c = C-A-M-S-c
s = C-A-M-S-s
