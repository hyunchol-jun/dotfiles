- defaults:
    link:
      relink: true
      create: true

- clean: ["~"]

- link:
    ~/.config: config
    ~/.dotfiles: ""
    ~/.tmux.conf: tmux.conf
    ~/.zshrc: zshrc
    ~/.agents: .agents
    ~/bin/dev-up: bin/dev-up
    ~/.claude/commands: .claude/commands
    ~/.claude/skills: .agents/skills
    ~/.claude/workflows: .claude/workflows
    ~/.claude/statusline-command.sh: .claude/statusline-command.sh
    ~/.claude/CLAUDE.md: .claude/CLAUDE.md
    ~/.claude/ntfy-notify.sh: .claude/ntfy-notify.sh
    ~/.claude/tts-notify.sh: .claude/tts-notify.sh
    ~/.claude/agent-state.sh: .claude/agent-state.sh
    ~/.claude/.i-have-adhd-always: .claude/.i-have-adhd-always
    ~/.claude/output-styles: .claude/output-styles
    ~/.omp/agent/config.yml: .omp/config.yml
    ~/.codex/notify.sh: .codex/notify.sh
    ~/.codex/AGENTS.md: .codex/AGENTS.md

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [sh scripts/codex-appserver-setup.sh, Codex app-server agent (any Mac with codex)]
    - [sh scripts/link-codex-skills.sh, Linking agent skills into Codex]
