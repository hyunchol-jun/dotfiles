# Sourced by tmux.conf only on machines with Hyprland.
#
# vim-tmux-navigator's Ctrl+h/j/k/l stop at the edge of the tmux window. These
# replace its bindings so that the edge pane hands over to Hyprland, which
# focuses the next app window. See config/hypr/personal.lua.

# Same test the plugin uses for "this pane is running (Neo)vim or fzf".
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "run-shell -b '~/dotfiles/bin/nav h #{pane_id}'"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "run-shell -b '~/dotfiles/bin/nav j #{pane_id}'"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "run-shell -b '~/dotfiles/bin/nav k #{pane_id}'"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "run-shell -b '~/dotfiles/bin/nav l #{pane_id}'"

bind -T copy-mode-vi C-h run-shell -b '~/dotfiles/bin/nav h #{pane_id}'
bind -T copy-mode-vi C-j run-shell -b '~/dotfiles/bin/nav j #{pane_id}'
bind -T copy-mode-vi C-k run-shell -b '~/dotfiles/bin/nav k #{pane_id}'
bind -T copy-mode-vi C-l run-shell -b '~/dotfiles/bin/nav l #{pane_id}'
