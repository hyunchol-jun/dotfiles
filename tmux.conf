set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes at 1, not 0
# set -g base-index 1
# set -g pane-base-index 1
# set-window-option -g pane-base-index 1
# set-option -g renumber-windows on

# per-host theme so each machine is visually distinct (same idea as nvim's colorscheme-by-hostname)
# MacBook is left untouched: plugin default (mocha), no host segment, no border override
%if "#{m:*mini1*,#{host}}"
set -g @catppuccin_flavour 'frappe'
set -g @catppuccin_host 'on'
%elif "#{m:*mini2*,#{host}}"
set -g @catppuccin_flavour 'macchiato'
set -g @catppuccin_host 'on'
%endif

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist sessions after restart
set -g @plugin 'tmux-plugins/tmux-continuum' # saves sessions every 15 mins

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# split panes using | and open panes in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# these are the default values for the commands
bind s choose-session
bind w choose-tree

# reload config file
bind r source-file ~/.tmux.conf

# enable mouse mode
set -g mouse on

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Set escape time to reduce delay after pressing escape key in vim
set -sg escape-time 5

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Auto-create sessions in desired order — guarded so re-sourcing from
# inside tmux doesn't warn about nesting when they already exist
if-shell '! tmux has-session -t =personal 2>/dev/null' 'new-session -d -s personal'
if-shell '! tmux has-session -t =implentio 2>/dev/null' 'new-session -d -s implentio'
if-shell '! tmux has-session -t =implentio-worktrees 2>/dev/null' 'new-session -d -s implentio-worktrees'

# Initialize tmux plugin manager (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# per-host accent on the active pane border, after the theme loads so it wins
%if "#{m:*mini1*,#{host}}"
set -g pane-active-border-style 'fg=#4fd6be'  # teal, matches terafox
%elif "#{m:*mini2*,#{host}}"
set -g pane-active-border-style 'fg=#78a9ff'  # carbon blue, matches carbonfox
%endif
