set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g allow-passthrough on
set -g set-clipboard on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes at 1, not 0
# set -g base-index 1
# set -g pane-base-index 1
# set-window-option -g pane-base-index 1
# set-option -g renumber-windows on

# per-host theme so each machine is visually distinct (same idea as nvim's colorscheme-by-hostname)
# MacBook is left untouched: plugin default (mocha), no host segment, no border override
%if "#{m:*mini1*,#{host}}"
set -g @catppuccin_flavour 'frappe'
%elif "#{m:*mini2*,#{host}}"
set -g @catppuccin_flavour 'macchiato'
%endif

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist sessions after restart
set -g @plugin 'tmux-plugins/tmux-continuum' # saves sessions every 15 mins

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# split panes using | and open panes in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# these are the default values for the commands
bind s choose-session
bind w choose-tree

# reload config file
bind r source-file ~/.tmux.conf

# toggle agent-status sidebar (Claude Code/codex panes, local + remote hosts).
# List every machine in the mesh — each one auto-skips itself, so this exact
# line works on all of them. To add a machine: append its ssh name here and
# run ssh-copy-id <name> from each machine that should see it.
set -g @agent_sidebar_hosts "mini1 mini2"
bind a run-shell "~/dotfiles/scripts/tmux-agent-sidebar.sh toggle"
# Follow the user: while the sidebar is open, every navigation event drags the
# pane into the window you just landed in. The `if -F` guard keeps the cost at
# zero — no process is spawned — whenever the sidebar is closed.
set-hook -g client-session-changed { if -F '#{@agent_sidebar_on}' { run-shell -b "~/dotfiles/scripts/tmux-agent-sidebar.sh sync #{window_id}" } }
set-hook -g after-select-window    { if -F '#{@agent_sidebar_on}' { run-shell -b "~/dotfiles/scripts/tmux-agent-sidebar.sh sync #{window_id}" } }
set-hook -g after-new-window       { if -F '#{@agent_sidebar_on}' { run-shell -b "~/dotfiles/scripts/tmux-agent-sidebar.sh sync #{window_id}" } }

# enable mouse mode
set -g mouse on

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Set escape time to reduce delay after pressing escape key in vim
set -sg escape-time 5

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Auto-create sessions in desired order — guarded so re-sourcing from
# inside tmux doesn't warn about nesting when they already exist
if-shell '! tmux has-session -t =personal 2>/dev/null' 'new-session -d -s personal'
if-shell '! tmux has-session -t =implentio 2>/dev/null' 'new-session -d -s implentio'
if-shell '! tmux has-session -t =implentio-worktrees 2>/dev/null' 'new-session -d -s implentio-worktrees'

# Initialize tmux plugin manager (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# per-host accents and pane backgrounds, after the theme loads so they win.
# window-style paints the pane background, so the whole terminal reads as
# that machine's color regardless of the emulator's own background.
%if "#{m:*mini1*,#{host}}"
set -g pane-active-border-style 'fg=#4fd6be'   # teal, matches terafox
set -g window-active-style 'bg=#152528'        # terafox background
set -g window-style 'bg=#0f1c1e'               # dimmed on inactive panes
set -g status-style 'bg=#0f1c1e'
set -g status-left "#[fg=#0f1c1e,bg=#4fd6be,bold] 󰒋 #h #[fg=#4fd6be,bg=#0f1c1e]"
%elif "#{m:*mini2*,#{host}}"
set -g pane-active-border-style 'fg=#78a9ff'   # carbon blue, matches carbonfox
set -g window-active-style 'bg=#161616'        # carbonfox background
set -g window-style 'bg=#0c0c0c'               # dimmed on inactive panes
set -g status-style 'bg=#0c0c0c'
set -g status-left "#[fg=#0c0c0c,bg=#78a9ff,bold] 󰒋 #h #[fg=#78a9ff,bg=#0c0c0c]"
%endif
